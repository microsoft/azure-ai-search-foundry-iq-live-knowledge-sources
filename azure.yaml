name: azure-ai-search-foundry-iq-live-knowledge-sources
resourceGroup: ${AZURE_RESOURCE_GROUP}
metadata:
  template: azure-ai-search-foundry-iq-live-knowledge-sources@2.0.0

infra:
  provider: bicep
  path: infra

services:
  static-app:
    project: ./static-app
    dist: dist
    language: js
    host: staticwebapp
    hooks:
      postdeploy:
        run: ../scripts/deploy_static_webapp_api.py

hooks:
  preprovision:
    run: ./scripts/ensure_azd_defaults.py
    interactive: false
    continueOnError: false
  postprovision:
    run: ./scripts/azd_postprovision.py
    interactive: true
    continueOnError: false
