name: Release contract

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: Release artifact dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-liveks.txt
            requirements-release.txt

      - name: Install release dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -r requirements-liveks.txt -r requirements-release.txt

      - name: Build and verify release candidate
        run: python scripts/release.py dry-run --output-dir .release/dry-run

      - name: Upload dry-run evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dry-run-${{ github.event.pull_request.head.sha || github.sha }}
          path: .release/dry-run/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  publish:
    name: Publish trusted versioned release
    if: >-
      github.repository == 'microsoft/azure-ai-search-foundry-iq-live-knowledge-sources' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out trusted tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-liveks.txt
            requirements-release.txt

      - name: Install release dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -r requirements-liveks.txt -r requirements-release.txt

      - name: Verify trusted tag and commit
        run: python scripts/release.py verify-tag

      - name: Rebuild release artifacts
        run: python scripts/release.py dry-run --output-dir .release/publish

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            .release/publish/*.tar.gz
            .release/publish/*-manifest.json
            .release/publish/*-sbom.spdx.json
            .release/publish/*-SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Foundry IQ Live Knowledge Sources Accelerator $GITHUB_REF_NAME"
          --notes-file docs/releases/v2.0.0.md
          .release/publish/*.tar.gz
          .release/publish/*-manifest.json
          .release/publish/*-sbom.spdx.json
          .release/publish/*-SHA256SUMS.txt
