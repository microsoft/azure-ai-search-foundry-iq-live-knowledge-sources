name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-validation:
    name: Local validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: static-app/package-lock.json

      - name: Install LiveKS CLI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-liveks.txt

      - name: Run documented first path
        run: python scripts/check_compatibility.py --run-commands posix

      - name: Upload first-success evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: first-success-evidence
          path: .deployment/first-run-evidence.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Check whitespace
        run: git diff --check

  cli-windows:
    name: LiveKS CLI on Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: static-app/package-lock.json

      - name: Install contract checker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-liveks.txt

      - name: Run documented Windows first path
        run: python scripts/check_compatibility.py --run-commands windows
