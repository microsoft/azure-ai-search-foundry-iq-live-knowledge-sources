name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-validation:
    name: Local validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: static-app/package-lock.json

      - name: Install LiveKS CLI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-liveks.txt

      - name: Run documented first path
        run: python scripts/check_compatibility.py --run-commands posix

      - name: Upload first-success evidence
        uses: actions/upload-artifact@v7
        with:
          name: first-success-evidence
          path: .deployment/first-run-evidence.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Check whitespace
        run: git diff --check

  cli-windows:
    name: LiveKS CLI on Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: static-app/package-lock.json

      - name: Install contract checker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-liveks.txt

      - name: Run documented Windows first path
        run: python scripts/check_compatibility.py --run-commands windows
