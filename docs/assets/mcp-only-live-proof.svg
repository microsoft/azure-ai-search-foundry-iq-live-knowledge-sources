  <text x="198" y="576" font-family="Consolas, monospace" font-size="17" fill="#E6EEF7">cleanup</text>
  <text x="480" y="576" font-family="Consolas, monospace" font-size="17" fill="#AFC6DB">generated resource group absent</text>

  <text x="94" y="624" font-family="Consolas, monospace" font-size="15" fill="#7895B0">answer: not retained | query: not retained | endpoint: not retained</text>

