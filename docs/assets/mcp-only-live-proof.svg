  <text x="1062" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Public proof keeps only:</text>
  <text x="1062" y="541" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">source kind and expected identities</text>
  <text x="1062" y="571" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">status, counts, API version, cleanup</text>
  <text x="1062" y="601" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">no endpoint, tenant ID, token, or content</text>

  <rect x="64" y="684" width="1472" height="40" rx="6" fill="#E8F3FC"/>
  <text x="88" y="710" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F548C">Source-backed artifact: samples/evidence/mcp-only-live-proof.sample.json | A static image alone is never the acceptance test.</text>
