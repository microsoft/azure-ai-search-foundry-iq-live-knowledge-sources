<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized MCP-only live validation evidence</title>
  <desc id="desc">A source-backed summary of a controlled live run showing HTTP 200, MCP Server activity or reference evidence, the expected Knowledge Source and tool identities, and successful cleanup. Endpoints, tenant identifiers, queries, answers, raw responses, and credentials are not retained.</desc>

  <rect width="1600" height="760" fill="#F7F9FC"/>
  <text x="64" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#116B4A">SANITIZED EVIDENCE CAPTURE</text>
  <text x="64" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#111827">The first live path returns source evidence, not just an answer.</text>
  <text x="66" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">Controlled mcp-only E2E | Azure AI Search 2026-05-01-preview | raw content and identifiers removed</text>

  <rect x="64" y="204" width="930" height="450" rx="8" fill="#0E1B2A" stroke="#28445F" stroke-width="2"/>
  <rect x="64" y="204" width="930" height="56" rx="8" fill="#172A3D"/>
  <rect x="64" y="248" width="930" height="12" fill="#172A3D"/>
  <text x="92" y="239" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#D9E7F5">liveks verify --env &lt;redacted&gt; --format json</text>

  <text x="94" y="312" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#72E09A">LiveKS verify: PASS</text>

