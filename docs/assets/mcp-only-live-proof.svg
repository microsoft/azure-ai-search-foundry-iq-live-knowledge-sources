  <text x="108" y="367" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#C6F6D5">PASS</text>
  <text x="198" y="368" font-family="Consolas, monospace" font-size="17" fill="#E6EEF7">app-status</text>
  <text x="480" y="368" font-family="Consolas, monospace" font-size="17" fill="#AFC6DB">HTTP 200</text>

  <rect x="92" y="398" width="84" height="30" rx="5" fill="#154D32"/>
  <text x="108" y="419" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#C6F6D5">PASS</text>
  <text x="198" y="420" font-family="Consolas, monospace" font-size="17" fill="#E6EEF7">mcp-retrieve</text>
  <text x="480" y="420" font-family="Consolas, monospace" font-size="17" fill="#AFC6DB">mcpServer evidence returned</text>

