  <text x="108" y="523" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#C6F6D5">PASS</text>
  <text x="198" y="524" font-family="Consolas, monospace" font-size="17" fill="#E6EEF7">tool</text>
  <text x="480" y="524" font-family="Consolas, monospace" font-size="17" fill="#AFC6DB">microsoft_docs_search</text>

