<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">From clone to grounded proof with LiveKS</title>
  <desc id="desc">A six-step outcome journey: clone and replay without cloud resources, choose a deployment profile, run doctor and plan without provisioning, deploy after preview and confirmation, verify source evidence through REST and MCP, and clean up with ownership and absence checks.</desc>

  <rect width="1600" height="800" fill="#F8FAFC"/>

  <text x="56" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F6CBD">FROM CLONE TO GROUNDED PROOF</text>
  <text x="56" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#111827">Clone once. Finish with grounded evidence.</text>
  <text x="58" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569">Replay locally, choose the smallest live path, preview before creating, prove the source trace, and clean up generated resources.</text>

