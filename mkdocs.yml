site_name: Live Knowledge Sources Manual
site_description: Execution manual for Azure AI Search and Foundry IQ live Knowledge Sources.
repo_url: https://github.com/microsoft/azure-ai-search-foundry-iq-live-knowledge-sources
repo_name: microsoft/azure-ai-search-foundry-iq-live-knowledge-sources

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start Here:
      - Home: index.md
      - Codespaces First Live: 15-codespaces-first-live.md
      - Runbook: runbook.md
      - Knowledge Base MCP Client: 22-knowledge-base-mcp.md
      - LiveKS CLI: 20-liveks-cli.md
      - Configuration: 21-configuration.md
      - Overview: 00-overview.md
      - Choose a Pattern: 02-choose-a-pattern.md
      - Offline Replay: 09-offline-replay.md
  - Live Paths:
      - Architecture: 01-architecture.md
      - Stable Search Index KS: 23-search-index-ks.md
      - MCP + Search Index KB: 24-mcp-search-index-kb.md
      - MCP Server KS: 03-mcp-server-ks.md
      - Fabric Ontology KS: 04-fabric-ontology-ks.md
      - Fabric Prerequisites: fabric-ontology-prerequisites.md
      - Combined KB Routing: 05-combined-kb-routing.md
      - One-Command Deployment: 10-one-command-deployment.md
      - BYO Fabric Validation: 11-fabric-live-byo-validation.md
  - Operate:
      - Post-Deployment Tests: 08-test-queries.md
      - Guided Live Demo: 16-demo-walkthrough.md
      - Troubleshooting: 07-troubleshooting.md
      - Security and Governance: 06-security-governance.md
      - External Tenant Login: external-tenant-login.md
      - Repo Boundaries: 12-repo-boundaries.md
      - Release and Supply Chain: 17-release-supply-chain.md
      - Preview Limitations: 13-public-preview-limitations.md
      - API Compatibility: 14-api-compatibility.md
      - FAQ: 19-faq.md
  - Samples:
      - REST Requests: samples/rest.md
      - Python Helpers: samples/python.md
      - Offline Responses: samples/responses.md
      - Airline Ops Ontology: samples/ontology.md
      - Notebooks: samples/notebooks.md

exclude_docs: |
  /maintainers/
