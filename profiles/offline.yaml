schema_version: 2
profile: offline
kind: deployment
purpose: Inspect checked-in scenario-pack retrieve responses without cloud resources, tenant access, or secrets.
default: true
required_tools: [python3]
estimated_duration: under 1 minute
cost: No cloud resources.
defaults:
  deployment:
    mode: offline
  runtime:
    telemetry_disabled: true
    run_live_calls: false
required: []
resources: []
success_criteria:
  - The default combined scenario replay prints an answer before trace details.
  - Every checked-in scenario manifest and replay assertion passes without network calls.
cleanup: No cleanup required.
